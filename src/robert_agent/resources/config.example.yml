version: 1
data_dir: ~/.local/share/robert
database: robert.sqlite3

github:
  account: robert-bot
  poll_seconds: 300

skills:
  search_paths: []

daemon:
  enabled: true
  local_poll_seconds: 5
  github_poll_seconds: 300
  github_poll_when_full_seconds: 600
  rate_limit_cache_seconds: 300
  min_search_remaining: 10
  min_core_remaining: 500
  live_run_timeout_seconds: 300
  local_drain_timeout_seconds: 180
  event_retention_days: 7
  run_on_start: false

workers:
  default:
    adapter: codex
    command: codex
    model: default
    effort: default

routes: {}
repos: []

# Per-repository PR automation is opt-in. Add this block to a repository entry:
#
# pr_automation:
#   conflict:
#     enabled: false
#     max_attempts: 2
#     max_wall_minutes: 60
#   ci:
#     enabled: false
#     check_allowlist: []
#     max_attempts: 2
#     max_wall_minutes: 120
#     max_total_tokens: 200000
#     max_cost_usd: 10.0
#     max_failure_summary_chars: 12000
