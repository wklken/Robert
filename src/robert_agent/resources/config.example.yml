version: 2

data_dir: ~/.local/share/robert
database: robert.sqlite3
# 可选高级设置；默认使用运行 Robert 的解释器，通常应省略。
# python_bin: /srv/robert/.venv/bin/python3

# 必填名称引用；显式选择默认 worker。
default_worker: coder

github:
  account: robert-bot
  polling:
    # 常驻启动/扫描失败回退；同时用于同步路径的正常间隔。
    # 扫描成功后仍遵循服务端提示和扫描返回值。
    fallback_seconds: 300
    # 以下仅用于 daemon --once 同步诊断路径。
    synchronous:
      full_capacity_seconds: 600
      rate_limit_cache_seconds: 300
  rate_limit:
    min_search_remaining: 10
    min_core_remaining: 500

scheduler:
  max_concurrency: 3
  # 原生 review/vote 共享模型池；每轮仍占一个任务槽位。
  model_max_concurrency: 4
  local_poll_seconds: 5
  lease_ttl_seconds: 540

supervision:
  # Independent observation service; recovery and diagnosis remain opt-in.
  mode: observe
  poll_seconds: 60
  batch_size: 100
  stall_seconds: 300
  diagnosis: null
  # mode: decide requires a dedicated no-tool decision command; see docs/features/task-supervision.md.
  decision: null
  recovery: null
  repair: null
  build_manifest: null
  heartbeat_stale_seconds: 1200
  hard_timeout_seconds: 3600
  startup_grace_seconds: 300

daemon:
  enabled: true
  scan_on_start: false
  control_timeouts:
    github_scan_seconds: 300
    # 同时限制本地 drain 和常驻 publisher 控制子进程。
    local_cycle_seconds: 180

maintenance:
  enabled: true
  interval_seconds: 300
  batch_size: 100
  retention:
    runs_days: 7
    failed_runs_days: 30
    daemon_events_days: 7

workers:
  coder:
    adapter: codex
    command: codex
    model: default
    effort: default
    # 可选；如已有配置应保留实际值，不要照抄未验证模型名。
    # fallback_model: YOUR_SUPPORTED_FALLBACK_MODEL
    timeout_seconds: 3600
    environment_allowlist: []
  reviewer:
    adapter: claude
    command: claude
    model: default
    effort: default
    timeout_seconds: 3600
    environment_allowlist: []

skills:
  search_paths: []

routes:
  new-pr:
    worker: coder
    # 可选，覆盖普通自动执行；省略时继承所选 worker。
    model: default
    effort: default
    required_skills: []
    recommended_skills: []
  review-pr:
    worker: coder
    multi_agent_review:
      enabled: false
      workers: [coder, reviewer]
      author_allowlist: []
  vote:
    worker: coder
    multi_agent_vote:
      enabled: false
      workers: [coder, reviewer]

# Add a real repository before running config validate or starting Robert.
# See docs/reference.md#configuration for a complete repository example.
repos: []

# Optional operator chat; disabled unless explicitly configured.
# See docs/features/operator-messaging.md for exact identity and repository scoping.
messaging:
  enabled: false
  dispatch_enabled: false
  # Before enabling, set send_after to the current time with an explicit timezone.
  # Retain that value on normal restarts; only newer notifications are delivered.
