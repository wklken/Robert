name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      full-checks:
        description: Run the complete release validation matrix and packaging checks
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B tests/simulations/compose/run.py --suite smoke --artifacts "${{ runner.temp }}/robert-compose"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robert-compose-smoke
          path: ${{ runner.temp }}/robert-compose
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools certifi
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: lint-imports --config pyproject.toml --no-cache
      - run: >-
          python -m mypy
          src/robert_agent/cli
          src/robert_agent/paths.py
          src/robert_agent/configuration
          src/robert_agent/execution/stages.py
          src/robert_agent/context/skills.py
          src/robert_agent/adapters/services/native.py
      - run: python -m compileall -q src
      - run: git diff --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-checks && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.full-checks && '["3.11", "3.12", "3.13", "3.14", "3.15"]' || '["3.11", "3.15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools certifi
      - run: python -m pip install -e '.[dev]'
      - name: Restrict the disposable CI interpreter for maintenance tests
        shell: python
        run: |
          import os, stat, subprocess, sys
          from pathlib import Path
          executable = Path(sys.executable).resolve()
          info = executable.stat()
          print(f"Maintenance interpreter: {executable}; mode={stat.S_IMODE(info.st_mode):04o}; owner={info.st_uid}; runner={os.geteuid()}", flush=True)
          # The production maintenance policy rejects group/world-writable
          # executables. Hosted tool caches can ship with broader permissions.
          if info.st_mode & 0o022:
              if info.st_uid == 0 and os.geteuid() != 0:
                  subprocess.run(['sudo', '-n', 'chmod', 'go-w', str(executable)], check=True)
              else:
                  executable.chmod(stat.S_IMODE(info.st_mode) & ~0o022)
          from robert_agent.workflows.maintenance.repair import _fingerprint_file
          _fingerprint_file(executable)
      - run: python -B -m unittest discover -s tests
      - name: Record the tested environment for dependency audit
        if: inputs.full-checks
        id: audit-target
        shell: python
        run: |
          import os, sysconfig
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("site=" + sysconfig.get_paths()["purelib"] + "\n")
      # Keep audit tooling isolated while inspecting the actual packages
      # tested on every supported Python version.
      - uses: actions/setup-python@v7
        if: inputs.full-checks
        with:
          python-version: "3.14"
      - run: python -m venv .audit-venv
        if: inputs.full-checks
      - run: .audit-venv/bin/python -m pip install --upgrade pip pip-audit 'filelock>=4.2.1'
        if: inputs.full-checks
      - run: .audit-venv/bin/python -m pip_audit --path '${{ steps.audit-target.outputs.site }}' --skip-editable
        if: inputs.full-checks
      - run: .audit-venv/bin/python -m pip_audit
        if: inputs.full-checks

  wheel-smoke:
    if: inputs.full-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/robert-smoke
      - run: /tmp/robert-smoke/bin/pip install dist/*.whl
      - run: /tmp/robert-smoke/bin/robert --version
      - run: /tmp/robert-smoke/bin/robert --help
      - name: Verify installed modules, resources and recovery entrypoints
        working-directory: /tmp
        run: |
          /tmp/robert-smoke/bin/python -I - <<'PYTHON'
          import importlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import robert_agent
          from robert_agent.resource_files import resource
          package = Path(robert_agent.__file__).parent
          assert 'site-packages' in str(package), package
          for path in package.rglob('*.py'):
              parts = path.relative_to(package).with_suffix('').parts
              if parts[-1] == '__init__':
                  parts = parts[:-1]
              if parts:
                  importlib.import_module('robert_agent.' + '.'.join(parts))
          for name in json.loads(resource('entrypoints.json').read_text()):
              assert callable(importlib.import_module(name).main), name
          assert resource('workflow.yml').is_file()
          assert resource('routes.yml').is_file()
          for name in (
              'runtime.scan', 'runtime.control', 'runtime.paused_monitor',
              'workflows.maintenance.worker', 'workflows.review.coordinator', 'workflows.vote.coordinator',
          ):
              subprocess.run([sys.executable, '-I', '-m', 'robert_agent.' + name, '--help'], check=True)
          PYTHON

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-links:
    if: inputs.full-checks
    runs-on: ubuntu-latest
    env:
      # Keep requests to the same host conservative during link checks.
      LYCHEE_ARGS: >-
        --no-progress
        --host-concurrency 2
        --cache
        README.md
        README_EN.md
        COMMUNITY.md
        CONTRIBUTING.md
        SECURITY.md
        SUPPORT.md
        CODE_OF_CONDUCT.md
        docs
    steps:
      - uses: actions/checkout@v7
      - name: Start with a fresh link-check cache
        # Share successful checks only between attempts in this job.
        run: rm -f .lycheecache
      - name: Check documentation links
        id: links
        # Retry transient download/HTTP failures once; repeated failure stays fatal.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          failIfEmpty: false
          args: ${{ env.LYCHEE_ARGS }}
      - name: Wait before retrying link checks
        if: steps.links.outcome == 'failure'
        run: sleep 15
      - name: Retry documentation links once
        if: steps.links.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2
        with:
          failIfEmpty: false
          args: ${{ env.LYCHEE_ARGS }}
