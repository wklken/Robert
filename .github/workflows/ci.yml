name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools certifi
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: >-
          python -m mypy
          src/robert_agent/cli
          src/robert_agent/paths.py
          src/robert_agent/route_config.py
          src/robert_agent/skills.py
          src/robert_agent/service.py
          src/robert_agent/migrate.py
      - run: python -B -m unittest discover -s tests
      - run: python -m compileall -q src
      - run: python -m build
      - run: git diff --check
      - name: Record the tested environment for dependency audit
        id: audit-target
        shell: python
        run: |
          import os, sysconfig
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("site=" + sysconfig.get_paths()["purelib"] + "\n")
      # filelock's security fixes require Python 3.11+. Keep audit tooling
      # separate while inspecting the actual packages tested on every version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install --upgrade pip pip-audit 'filelock>=4.2.1'
      - run: .audit-venv/bin/python -m pip_audit --path '${{ steps.audit-target.outputs.site }}' --skip-editable
      - run: .audit-venv/bin/python -m pip_audit


  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/robert-smoke
      - run: /tmp/robert-smoke/bin/pip install dist/*.whl
      - run: /tmp/robert-smoke/bin/robert --version
      - run: /tmp/robert-smoke/bin/robert --help

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          failIfEmpty: false
          args: >-
            --no-progress
            README.md
            README_EN.md
            COMMUNITY.md
            docs
