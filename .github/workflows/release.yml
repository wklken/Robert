name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install build
      - name: Restrict the disposable CI interpreter for maintenance tests
        shell: python
        run: |
          import os, stat, subprocess, sys
          from pathlib import Path
          executable = Path(sys.executable).resolve()
          info = executable.stat()
          print(f"Maintenance interpreter: {executable}; mode={stat.S_IMODE(info.st_mode):04o}; owner={info.st_uid}; runner={os.geteuid()}", flush=True)
          # The production maintenance policy rejects group/world-writable
          # executables. Hosted tool caches can ship with broader permissions.
          if info.st_mode & 0o022:
              if info.st_uid == 0 and os.geteuid() != 0:
                  subprocess.run(['sudo', '-n', 'chmod', 'go-w', str(executable)], check=True)
              else:
                  executable.chmod(stat.S_IMODE(info.st_mode) & ~0o022)
          from robert_agent.supervision_repair import _fingerprint_file
          _fingerprint_file(executable)
      - run: python -B -m unittest discover -s tests
      - run: python -m build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
