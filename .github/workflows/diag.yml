name: diag-macos-terminate
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -c "import sys; print(sys.executable, sys._base_executable)"
      - run: python -B diag/run_flaky.py 40
